services:
  postgres:
    image: postgres:16
    container_name: ifesdoc_postgres
    environment:
      POSTGRES_DB: ifesdoc
      POSTGRES_USER: ifesdoc_user
      POSTGRES_PASSWORD: ifesdoc_pass
    ports:
      - "${IFESDOC_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - ifesdoc_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifesdoc_user -d ifesdoc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ifesdoc_backend:local
    container_name: ifesdoc_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ifesdoc_user:ifesdoc_pass@postgres:5432/ifesdoc
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY com pelo menos 32 caracteres antes de iniciar o ambiente}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Defina uma senha inicial forte para o administrador}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      BACKEND_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      DOCUMENT_UPLOAD_DIR: /app/storage/documents
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      BOT_ENABLE_TELEGRAM: ${BOT_ENABLE_TELEGRAM:-false}
      BOT_ENABLE_WHATSAPP: ${BOT_ENABLE_WHATSAPP:-false}
      BOT_PUBLIC_MODE: ${BOT_PUBLIC_MODE:-true}
      BOT_RATE_LIMIT_PER_MINUTE: ${BOT_RATE_LIMIT_PER_MINUTE:-20}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-por}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      OCR_MIN_TEXT_LENGTH: ${OCR_MIN_TEXT_LENGTH:-50}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/storage/documents
    networks:
      - ifesdoc_net

  notification-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ifesdoc_backend:local
    container_name: ifesdoc_notification_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ifesdoc_user:ifesdoc_pass@postgres:5432/ifesdoc
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY com pelo menos 32 caracteres antes de iniciar o ambiente}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      NOTIFICATION_WORKER_INTERVAL_SECONDS: 60
    command: ["python", "-m", "app.workers.notification_worker"]
    restart: unless-stopped
    networks:
      - ifesdoc_net

  frontend:
    build:
      context: ..
      dockerfile: interface-web/Dockerfile
    container_name: ifesdoc_frontend
    depends_on:
      - backend
    environment:
      VITE_APP_NAME: IFESDOC
      VITE_API_URL: http://localhost:8000
      VITE_USE_MOCK_API: "false"
    ports:
      - "8080:8080"
    networks:
      - ifesdoc_net

  sonarqube_db:
    image: postgres:16
    container_name: ifesdoc_sonarqube_db

    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube

    ports:
      - "${IFESDOC_SONAR_POSTGRES_PORT:-55434}:5432"

    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - ifesdoc_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  sonarqube:
    image: sonarqube:community
    container_name: ifesdoc_sonarqube
    depends_on:
      sonarqube_db:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

    ports:
      - "9000:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - ifesdoc_net

    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

volumes:
  postgres_data:
  document_storage:
  sonarqube_postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  ifesdoc_net:
    name: ifesdoc_net
